name: epg-grabber

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install epg-grabber
        run: npm install -g epg-grabber

      - name: Run EPG Grabber for TVPassport
        run: |
          # Grabs TVPassport data and writes straight to CN/AS.xml
          epg-grabber --site=tvpassport.com --config=sites.config.js --output=CN/AS.xml || epg-grabber --config=config.json --output=CN/AS.xml

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add CN/AS.xml
          
          if git diff --staged --quiet; then
            echo "No changes detected in CN/AS.xml"
          else
            git commit -m "Auto-update CN/AS.xml via epg-grabber [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
          
